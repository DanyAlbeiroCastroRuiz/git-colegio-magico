name: El Tribunal Mágico (Validación de Hechizos)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Necesitamos permisos de escritura para que el bot pueda crear Issues
permissions:
  issues: write
  contents: read

jobs:
  evaluar-magia:
    runs-on: ubuntu-latest

    steps:
    - name: Leer pergaminos (Checkout)
      uses: actions/checkout@v4

    - name: Preparar varitas (Set up JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Invocar pruebas mágicas (Run Tests)
      # Ejecutamos las pruebas, pero no detenemos el workflow si fallan
      # para poder leer los reportes y comentarle al estudiante.
      run: mvn test -Dmaven.test.failure.ignore=true
      
    - name: El Veredicto del Tribunal (Issue Manager)
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const script = require('./.github/scripts/tribunal.js')
          await script({github, context})
